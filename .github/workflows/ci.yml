name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgres://pyt:pyt_ci@127.0.0.1:5432/pyt_test
    services:
      db:
        image: postgres:18.6
        env:
          POSTGRES_USER: pyt
          POSTGRES_PASSWORD: pyt_ci
          POSTGRES_DB: pyt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pyt" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 26.12.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level low
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgres://pyt:pyt_ci@127.0.0.1:5432/pyt
          APP_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
