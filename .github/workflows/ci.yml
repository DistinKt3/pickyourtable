name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgres://pyt:pyt_ci@127.0.0.1:5432/pyt_test
    services:
      db:
        image: postgres:18.6
        env:
          POSTGRES_USER: pyt
          POSTGRES_PASSWORD: pyt_ci
          POSTGRES_DB: pyt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pyt" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: pnpm
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner -c /repo/.gitleaks.toml
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level low
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgres://pyt:pyt_ci@127.0.0.1:5432/pyt
          APP_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
