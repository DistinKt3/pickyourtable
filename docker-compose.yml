services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: pyt
      POSTGRES_PASSWORD: pyt_local_only
      POSTGRES_DB: pyt
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pyt-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyt -d pyt"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pyt-db:
